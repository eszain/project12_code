<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="858px" preserveAspectRatio="none" style="width:437px;height:858px;background:#FFFFFF;" version="1.1" viewBox="0 0 437 858" width="437px" zoomAndPan="magnify"><title>Configuration management: from issue to release</title><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="394.249" x="20" y="32.9951">Configuration management: from issue to release</text><ellipse cx="175.29" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F2F2F2" height="35.1328" rx="5" ry="5" style="stroke:#6B6B6B;stroke-width:0.5;" width="246.3955" x="52.0923" y="87.2969"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.3955" x="62.0923" y="109.3638">GitHub issue assigned to an owner</text><rect fill="#F2F2F2" height="50.2656" rx="5" ry="5" style="stroke:#6B6B6B;stroke-width:0.5;" width="137.1396" x="106.7202" y="142.4297"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="117.1396" x="116.7202" y="164.4966">Branch from main</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="115.064" x="116.7202" y="179.6294">(feature/..., fix/...)</text><rect fill="#F2F2F2" height="35.1328" rx="5" ry="5" style="stroke:#6B6B6B;stroke-width:0.5;" width="174.2417" x="88.1692" y="212.6953"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="154.2417" x="98.1692" y="234.7622">Commit work with tests</text><rect fill="#F2F2F2" height="35.1328" rx="5" ry="5" style="stroke:#6B6B6B;stroke-width:0.5;" width="302.2739" x="24.1531" y="267.8281"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="282.2739" x="34.1531" y="289.895">Run npm test, npm run build, pytest locally</text><rect fil