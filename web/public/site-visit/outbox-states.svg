<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="609px" preserveAspectRatio="none" style="width:681px;height:609px;background:#FFFFFF;" version="1.1" viewBox="0 0 681 609" width="681px" zoomAndPan="magnify"><title>Notification outbox entry: delivery states (outbox.ts)</title><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="420.4854" x="123.6885" y="22.9951">Notification outbox entry: delivery states (outbox.ts)</text><ellipse cx="358.96" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="pending"><rect fill="#F2F2F2" height="50" rx="5" ry="5" style="stroke:#6B6B6B;stroke-width:0.5;" width="72.8442" x="120.46" y="155.2969"/><line style="stroke:#6B6B6B;stroke-width:0.5;" x1="120.46" x2="193.3042" y1="180.4297" y2="180.4297"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="52.8442" x="130.46" y="172.3638">pending</text></g><g id="suppressed"><rect fill="#F2F2F2" height="50" rx="5" ry="5" style="stroke:#6B6B6B;stroke-width:0.5;" width="94.6548" x="291.46" y="470.2969"/><line style="stroke:#6B6B6B;stroke-width:0.5;" x1="291.46" x2="386.1148" y1="495.4297" y2="495.4297"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="74.6548" x="301.46" y="487.3638">suppressed</text></g><g id="sent"><rect fill="#F2F2F2" height="50" rx="5" ry="5" style="stroke:#6B6B6B;stroke-width:0.5;" width="50" x="126.96" y="390.2969"/><line style="stroke:#6B6B6B;stroke-width:0.5;" x1="126.96" x2="176.96" y1="415.4297" y2="415.4297"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="28.1074" x="137.9063" y="407.3638">sent</text></g><g id="failed"><rect fill="#F2F2F2" height="50" rx="5" ry="5" style="stroke:#6B6B6B;stroke-width:0.5;" width="56.0166" x="240.96" y="310.2969"/><line style="stroke:#6B6B6B