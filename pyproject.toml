[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cads"
version = "0.1.0"
description = "CADS modernization MVP: CDM ingestion, encounter correlation, alerting and conjunction decision support (ENG 4000 Project 12, sponsored by the Canadian Space Agency)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.36",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["cads*"]

[tool.setuptools.package-data]
cads = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
